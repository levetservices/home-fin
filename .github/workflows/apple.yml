name: Apple app

# Builds the iPhone / iPad / Mac app (unsigned) and runs HomeFinKit's tests, so compile errors
# show up without needing a Mac.
on:
  push:
    branches: [home-fin]
    paths:
      - 'apple/**'
      - '.github/workflows/apple.yml'
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen

      - name: Build
        working-directory: apple
        run: |
          set -o pipefail
          xcodebuild build \
            -project HomeFin.xcodeproj \
            -scheme HomeFin \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*(deprecated|will never)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Errors
        if: failure()
        working-directory: apple
        run: grep -E "error:" build.log | sort -u | head -100

  test-kit:
    name: HomeFinKit tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Test
        working-directory: apple/HomeFinKit
        run: swift test
